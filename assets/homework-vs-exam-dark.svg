<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" width="800" height="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Homework scores up, exam scores down</title>
<desc id="d">Average closed-book exam score by homework score for 26,811 Chinese secondary students, January 2023 to June 2025, scaled so the average without AI is 100. For students who never used AI, higher homework scores go with higher exam scores, rising to about 111. For AI users, exam scores peak just under 100 at a homework score of about 104, then fall to about 64 at a homework score of 131. Data: Stromberg, Lei and Wu (2026), Figure A11.</desc>
